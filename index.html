<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중등 음악 수업 계획: 감성 톡톡 플레이리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 400px;
        }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .step-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
    </style>
    <!-- Chosen Palette: Warm Neutrals & Soft Rose (Stone, Rose, Orange) for a calm, supportive, and feminine but professional aesthetic. -->
    <!-- Application Structure Plan:
         1. Dashboard Header: Sets the context (Target Audience, Goals).
         2. Curriculum Navigator (Tabs): Allows easy switching between the 4 sessions.
         3. Dynamic Session View:
            - Overview Cards: Key Objectives and Materials.
            - Time Distribution Chart: Visualizes the 5-30-5-5 split.
            - Interactive Lesson Flow: A vertical timeline or card list detailing the Intro, Development (Split into 3 steps), Eval, and Outro.
            - Engagement Graph: A line chart showing the projected energy levels of students throughout the 45 mins.
         4. Teacher's Toolkit: A sidebar or bottom section with general tips for this demographic.
         This structure allows the teacher to grasp the whole flow at a glance while drilling down into specific instruction steps.
    -->
    <!-- Visualization & Content Choices:
         - Doughnut Chart (Chart.js): To clearly show the time allocation (5m, 30m, 5m, 5m) for each session. Goal: Time Management.
         - Line Chart (Chart.js): To visualize the "Energy Flow" of the class. Middle schoolers' attention spans fluctuate; this helps the teacher plan energy regulation. Goal: Engagement Strategy.
         - Interactive Cards (HTML/JS): For the lesson steps. Text needs to be digestible. Interaction: Click to expand details/scripts.
         - Status Indicators (HTML/Tailwind): To show the "Phase" of the lesson (Intro/Dev/Eval).
         - Justification: Visuals help the teacher mentalize the abstract flow of time and energy.
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="bg-stone-50 text-stone-800">

    <!-- App Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Header Section -->
        <header class="mb-10 text-center fade-in">
            <h1 class="text-3xl md:text-4xl font-bold text-stone-800 mb-2">🎵 감성 톡톡! 나만의 음악 플레이리스트</h1>
            <p class="text-lg text-stone-600">중학교 1-2학년 여학생 대상 음악 창작 및 감상 수업 (4차시 완성)</p>
            <div class="mt-6 flex justify-center gap-4 flex-wrap">
                <span class="px-4 py-2 bg-rose-100 text-rose-800 rounded-full text-sm font-semibold shadow-sm">대상: 여자 중학생 (1~2학년)</span>
                <span class="px-4 py-2 bg-orange-100 text-orange-800 rounded-full text-sm font-semibold shadow-sm">시간: 45분 / 4차시</span>
                <span class="px-4 py-2 bg-stone-200 text-stone-700 rounded-full text-sm font-semibold shadow-sm">주제: 자아 표현 & 음악</span>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Left Sidebar: Navigation & Overview -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Navigation -->
                <nav class="bg-white rounded-xl shadow-sm p-6 border border-stone-200">
                    <h3 class="text-lg font-bold text-stone-800 mb-4 border-b border-stone-100 pb-2">수업 차시 선택</h3>
                    <div class="space-y-2" id="navButtons">
                        <!-- Buttons injected by JS -->
                    </div>
                </nav>

                <!-- Target Audience Insight -->
                <div class="bg-rose-50 rounded-xl shadow-sm p-6 border border-rose-100">
                    <h3 class="text-lg font-bold text-rose-900 mb-3">💡 학생 이해 포인트</h3>
                    <ul class="space-y-3 text-sm text-stone-700">
                        <li class="flex items-start">
                            <span class="mr-2">🌸</span>
                            <span><strong>감수성:</strong> 자신의 감정을 표현하고 싶어하지만, 너무 직접적인 노출은 꺼릴 수 있음.</span>
                        </li>
                        <li class="flex items-start">
                            <span class="mr-2">👯‍♀️</span>
                            <span><strong>또래 관계:</strong> 친구들과의 공유와 공감이 매우 중요한 동기부여 요소.</span>
                        </li>
                        <li class="flex items-start">
                            <span class="mr-2">📱</span>
                            <span><strong>디지털 네이티브:</strong> 짧은 호흡의 콘텐츠와 시각적 자극에 익숙함. (지루함 방지 필수)</span>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Right Content Area: Dynamic Session Details -->
            <div class="lg:col-span-3">
                <div id="contentArea" class="space-y-8 fade-in">
                    <!-- Dynamic Content Loading Here -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- Data: Lesson Plan Content ---
        const curriculumData = [
            {
                id: 1,
                title: "1차시: 음악과 나의 연결고리 (Music log)",
                goal: "자신의 감정을 음악과 연결하고, 선호하는 음악 취향을 탐색한다.",
                materials: "감정 카드, 활동지, 다양한 장르의 음악 샘플, 스티커",
                energyData: [30, 50, 60, 80, 70, 40], // Energy curve for graph
                flow: {
                    intro: { time: "5분", title: "마음 열기", desc: "최근에 들었던 노래 중 가장 기억에 남는 노래 한 소절 흥얼거리거나 제목 말하기 게임으로 가볍게 시작." },
                    dev: [
                        { time: "10분", title: "Step 1: 감정의 색깔 찾기", desc: "다양한 분위기의 음악 3곡(신남, 차분함, 긴장됨)을 듣고, 각 음악이 주는 느낌을 '색깔'이나 '날씨'로 표현해본다." },
                        { time: "10분", title: "Step 2: 나만의 인생 BGM 선정", desc: "'등교할 때', '우울할 때', '기분 좋을 때' 듣고 싶은 BGM을 선정하고 이유를 활동지에 적는다." },
                        { time: "10분", title: "Step 3: 익명 음악 엽서 쓰기", desc: "친구에게 추천해주고 싶은 노래와 짧은 사연을 익명으로 엽서에 적어 '음악 우체통'에 넣는다." }
                    ],
                    eval: { time: "5분", title: "공감 투표", desc: "음악 우체통에서 무작위로 사연을 뽑아 읽어주고, 공감되는 사연에 박수치기." },
                    concl: { time: "5분", title: "정리 및 예고", desc: "음악이 감정을 표현하는 도구임을 상기시키고 다음 차시(리듬) 예고." }
                }
            },
            {
                id: 2,
                title: "2차시: 리듬으로 통하는 우리 (Rhythm Connection)",
                goal: "간단한 리듬을 창작하고 신체를 활용하여 표현하며 협동심을 기른다.",
                materials: "컵(컵타용), PPT 리듬 악보, 메트로놈(앱)",
                energyData: [40, 60, 85, 90, 70, 50],
                flow: {
                    intro: { time: "5분", title: "리듬 릴레이", desc: "교사가 박수를 치면 학생들이 그대로 따라 치는 '미러링 게임'으로 집중력 높이기." },
                    dev: [
                        { time: "10분", title: "Step 1: 컵타 기본기 익히기", desc: "책상을 활용한 4박자 기본 리듬(짝-짝-탁탁탁)을 배우고 반복 숙달한다." },
                        { time: "10분", title: "Step 2: 우리 모둠 리듬 만들기", desc: "4명씩 조를 이루어, 기본 리듬 사이에 각 조만의 특수 동작(하트 만들기, 손바닥 마주치기 등)을 1개 추가한다." },
                        { time: "10분", title: "Step 3: 리듬 배틀 리허설", desc: "메트로놈 비트에 맞춰 조별로 끊기지 않고 리듬을 연주하는 연습을 한다." }
                    ],
                    eval: { time: "5분", title: "미니 발표", desc: "조별로 만든 리듬을 짧게 선보이고, 가장 독창적인 동작을 만든 조를 칭찬한다." },
                    concl: { time: "5분", title: "정리 및 예고", desc: "리듬의 즐거움을 공유하고, 다음 차시(멜로디 창작) 준비물 안내." }
                }
            },
            {
                id: 3,
                title: "3차시: 나만의 멜로디 디자인 (Songwriting)",
                goal: "간단한 멜로디 메이킹 앱이나 허밍을 통해 짧은 멜로디를 창작한다.",
                materials: "태블릿PC(또는 스마트폰), 멜로디 작곡 앱(크롬 뮤직 랩 등), 오선지",
                energyData: [30, 50, 70, 60, 50, 40],
                flow: {
                    intro: { time: "5분", title: "음계 계단 오르기", desc: "도레미파솔라시도 음계를 몸으로 표현하며 높낮이 감각 익히기." },
                    dev: [
                        { time: "10분", title: "Step 1: 4마디 가사 쓰기", desc: "지난 시간의 '감정'을 주제로 4마디(짧은 문장 2~4개) 분량의 가사를 작성한다. (예: 떡볶이가 먹고 싶어, 정말 매운 떡볶이)" },
                        { time: "10분", title: "Step 2: 리듬에 멜로디 입히기", desc: "작성한 가사를 읽는 리듬에 맞춰, 3개 이상의 음을 사용하여 멜로디 라인을 그려본다. (스마트 기기 활용 가능)" },
                        { time: "10분", title: "Step 3: 짝꿍 피드백", desc: "짝꿍에게 들려주고 '느낌이 어떤지' 피드백을 주고받으며 수정한다." }
                    ],
                    eval: { time: "5분", title: "멜로디 갤러리", desc: "완성된 멜로디를 녹음하거나 활동지에 기록하여 제출한다." },
                    concl: { time: "5분", title: "정리 및 예고", desc: "작곡이 어렵지 않음을 격려하고 다음 차시(미니 콘서트) 안내." }
                }
            },
            {
                id: 4,
                title: "4차시: 우리 반 방구석 콘서트 (Mini Concert)",
                goal: "자신이 만든 결과물을 공유하고 친구의 작품을 감상하며 긍정적으로 소통한다.",
                materials: "스피커, 마이크, 무대 장식 소품, 감상 평가지",
                energyData: [50, 70, 80, 90, 80, 60],
                flow: {
                    intro: { time: "5분", title: "무대 세팅", desc: "교실 분위기를 콘서트장처럼 꾸미고(조명, 자리 배치), 관람 에티켓(경청, 박수)을 약속한다." },
                    dev: [
                        { time: "10분", title: "Step 1: 리허설 및 마음 준비", desc: "발표 순서를 정하고, 긴장을 풀기 위한 심호흡 및 최종 점검 시간을 갖는다." },
                        { time: "15분", title: "Step 2: 릴레이 버스킹", desc: "희망자 또는 모둠별로 1-3차시 동안 만든 결과물(리듬, 노래, 랩 등)을 1분 내외로 발표한다." },
                        { time: "5분", title: "Step 3: 하이라이트 톡", desc: "사회자(교사)가 발표 중간중간 인터뷰를 진행하여 학생의 의도를 돋보이게 한다." }
                    ],
                    eval: { time: "5분", title: "롤링 페이퍼", desc: "친구들의 발표에 대한 칭찬 한 줄 평을 포스트잇에 적어 칠판에 붙인다." },
                    concl: { time: "5분", title: "대단원 마무리", desc: "4차시 동안의 성장을 칭찬하고, 음악을 통해 나를 표현하는 즐거움을 되새기며 수업 종료." }
                }
            }
        ];

        // --- State ---
        let currentSessionId = 1;
        let timeChart = null;
        let energyChart = null;

        // --- DOM Elements ---
        const navButtonsContainer = document.getElementById('navButtons');
        const contentArea = document.getElementById('contentArea');

        // --- Initialization ---
        function init() {
            renderNav();
            renderSession(currentSessionId);
        }

        // --- Render Navigation ---
        function renderNav() {
            navButtonsContainer.innerHTML = '';
            curriculumData.forEach(session => {
                const btn = document.createElement('button');
                const isActive = session.id === currentSessionId;
                btn.className = `w-full text-left px-4 py-3 rounded-lg transition-all duration-200 flex items-center justify-between ${
                    isActive 
                    ? 'bg-rose-500 text-white shadow-md transform scale-[1.02]' 
                    : 'bg-white text-stone-600 hover:bg-stone-50 border border-transparent hover:border-stone-200'
                }`;
                btn.innerHTML = `
                    <span class="font-semibold text-sm md:text-base">${session.id}차시</span>
                    <span class="text-xs ${isActive ? 'text-rose-100' : 'text-stone-400'}">${session.title.split(':')[1].trim().substring(0, 10)}...</span>
                `;
                btn.onclick = () => {
                    if (currentSessionId !== session.id) {
                        currentSessionId = session.id;
                        renderNav();
                        renderSession(session.id);
                    }
                };
                navButtonsContainer.appendChild(btn);
            });
        }

        // --- Render Session Content ---
        function renderSession(id) {
            const data = curriculumData.find(d => d.id === id);
            
            // Fade effect wrapper
            contentArea.innerHTML = `
                <div class="fade-in">
                    <!-- Title & Overview Card -->
                    <div class="bg-white rounded-2xl shadow-sm p-6 border border-stone-200 mb-8">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-stone-100 pb-4 mb-4">
                            <div>
                                <h2 class="text-2xl font-bold text-stone-800">${data.title}</h2>
                                <p class="text-stone-500 text-sm mt-1">45분 수업 | 대상: 중1~2</p>
                            </div>
                            <div class="mt-2 md:mt-0">
                                <span class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded font-medium">활동 중심</span>
                                <span class="inline-block bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-medium">발표/표현</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="text-sm font-bold text-stone-400 uppercase mb-2">학습 목표</h4>
                                <p class="text-stone-800 font-medium leading-relaxed bg-stone-50 p-3 rounded-lg border-l-4 border-rose-400">
                                    ${data.goal}
                                </p>
                            </div>
                            <div>
                                <h4 class="text-sm font-bold text-stone-400 uppercase mb-2">준비물</h4>
                                <p class="text-stone-700 bg-stone-50 p-3 rounded-lg border-l-4 border-orange-300">
                                    ${data.materials}
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Layout: Left (Timeline) & Right (Charts) -->
                    <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                        
                        <!-- Timeline Section (2/3 width) -->
                        <div class="xl:col-span-2 space-y-6">
                            <h3 class="text-xl font-bold text-stone-800 flex items-center">
                                <span class="w-2 h-8 bg-rose-500 rounded mr-2"></span>
                                수업 흐름도 (Step-by-Step)
                            </h3>

                            <!-- Intro -->
                            <div class="step-card bg-white rounded-xl shadow-sm p-5 border-l-4 border-blue-400 transition-all">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="text-lg font-bold text-stone-800">도입 (Introduction)</h4>
                                    <span class="px-2 py-1 bg-blue-50 text-blue-600 text-xs font-bold rounded-md">⏱ ${data.flow.intro.time}</span>
                                </div>
                                <h5 class="text-blue-900 font-semibold mb-1">${data.flow.intro.title}</h5>
                                <p class="text-stone-600 text-sm">${data.flow.intro.desc}</p>
                            </div>

                            <!-- Development Container -->
                            <div class="bg-rose-50/50 rounded-xl p-6 border border-rose-100">
                                <div class="flex justify-between items-center mb-4">
                                    <h4 class="text-lg font-bold text-rose-900">전개 (Development) - 집중 활동</h4>
                                    <span class="px-2 py-1 bg-rose-100 text-rose-700 text-xs font-bold rounded-md">⏱ 30분 (총합)</span>
                                </div>
                                <div class="space-y-4">
                                    ${data.flow.dev.map((step, index) => `
                                        <div class="step-card bg-white rounded-lg p-4 shadow-sm border border-rose-100 relative overflow-hidden group">
                                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-rose-300 group-hover:bg-rose-500 transition-colors"></div>
                                            <div class="flex justify-between mb-1">
                                                <span class="text-xs font-bold text-rose-500 tracking-wider">STEP ${index + 1}</span>
                                                <span class="text-xs text-stone-400 font-mono">${step.time}</span>
                                            </div>
                                            <h5 class="font-bold text-stone-800 mb-2">${step.title}</h5>
                                            <p class="text-stone-600 text-sm leading-relaxed">${step.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Eval & Conclusion -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="step-card bg-white rounded-xl shadow-sm p-5 border-l-4 border-purple-400 transition-all">
                                    <div class="flex justify-between items-center mb-2">
                                        <h4 class="text-lg font-bold text-stone-800">평가 (Evaluation)</h4>
                                        <span class="px-2 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded-md">⏱ ${data.flow.eval.time}</span>
                                    </div>
                                    <h5 class="text-purple-900 font-semibold mb-1">${data.flow.eval.title}</h5>
                                    <p class="text-stone-600 text-sm">${data.flow.eval.desc}</p>
                                </div>
                                <div class="step-card bg-white rounded-xl shadow-sm p-5 border-l-4 border-stone-400 transition-all">
                                    <div class="flex justify-between items-center mb-2">
                                        <h4 class="text-lg font-bold text-stone-800">정리 (Conclusion)</h4>
                                        <span class="px-2 py-1 bg-stone-100 text-stone-600 text-xs font-bold rounded-md">⏱ ${data.flow.concl.time}</span>
                                    </div>
                                    <h5 class="text-stone-800 font-semibold mb-1">${data.flow.concl.title}</h5>
                                    <p class="text-stone-600 text-sm">${data.flow.concl.desc}</p>
                                </div>
                            </div>
                        </div>

                        <!-- Charts Section (1/3 width) -->
                        <div class="xl:col-span-1 space-y-8">
                            
                            <!-- Time Allocation Chart -->
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                                <h3 class="text-base font-bold text-stone-700 mb-4 text-center">⏰ 시간 배분 (45분)</h3>
                                <div class="chart-container" style="height: 250px;">
                                    <canvas id="timeChart"></canvas>
                                </div>
                                <p class="text-xs text-center text-stone-400 mt-2">전개 단계(30분)에 집중된 구조</p>
                            </div>

                            <!-- Energy Flow Chart -->
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-stone-200">
                                <h3 class="text-base font-bold text-stone-700 mb-4 text-center">⚡️ 예상 수업 에너지 흐름</h3>
                                <div class="chart-container" style="height: 200px;">
                                    <canvas id="energyChart"></canvas>
                                </div>
                                <div class="mt-4 bg-yellow-50 p-3 rounded text-xs text-yellow-800 border border-yellow-100">
                                    <strong>Tip:</strong> 그래프가 가장 높은 지점에서 학생들의 참여도가 최고조에 달합니다. 이때 교사의 적극적인 피드백이 필요합니다.
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            `;

            // Draw Charts after DOM update
            setTimeout(() => {
                drawCharts(data.energyData);
            }, 100);
        }

        // --- Chart Generation ---
        function drawCharts(energyDataPoints) {
            // Destroy existing instances if they exist
            if (timeChart) timeChart.destroy();
            if (energyChart) energyChart.destroy();

            // 1. Time Allocation Doughnut Chart
            const ctxTime = document.getElementById('timeChart').getContext('2d');
            timeChart = new Chart(ctxTime, {
                type: 'doughnut',
                data: {
                    labels: ['도입 (5분)', '전개 (30분)', '평가 (5분)', '정리 (5분)'],
                    datasets: [{
                        data: [5, 30, 5, 5],
                        backgroundColor: [
                            '#60A5FA', // Blue-400 (Intro)
                            '#F43F5E', // Rose-500 (Dev)
                            '#A78BFA', // Purple-400 (Eval)
                            '#A8A29E'  // Stone-400 (Concl)
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 10, family: "'Noto Sans KR', sans-serif" }, usePointStyle: true } },
                        tooltip: { 
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ${context.raw}분`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });

            // 2. Energy Flow Line Chart
            const ctxEnergy = document.getElementById('energyChart').getContext('2d');
            energyChart = new Chart(ctxEnergy, {
                type: 'line',
                data: {
                    labels: ['0분', '10분', '20분', '30분', '40분', '45분'],
                    datasets: [{
                        label: '학생 참여도/에너지',
                        data: energyDataPoints,
                        borderColor: '#F59E0B', // Amber-500
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 2,
                        tension: 0.4, // Smooth curves
                        fill: true,
                        pointBackgroundColor: '#F59E0B',
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { display: false, min: 0, max: 100 },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { intersect: false, mode: 'index' }
                    }
                }
            });
        }

        // --- Start App ---
        init();

    </script>
</body>
</html>
